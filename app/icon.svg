<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Fond circulaire noir profond -->
  <circle cx="60" cy="60" r="58" fill="#0a0a0a" stroke="#D4AF37" stroke-width="2"/>

  <!-- Initiales EP stylisées -->
  <g transform="translate(60, 60)" fill="#D4AF37" font-family="Cinzel, serif" font-size="48" font-weight="bold" text-anchor="middle" dominant-baseline="central">
    <text y="0">EP</text>
  </g>

  <!-- Effet de brillance subtil -->
  <circle cx="75" cy="45" r="10" fill="url(#shine)" opacity="0.15"/>

  <!-- Définitions de gradients -->
  <defs>
    <radialGradient id="shine" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>